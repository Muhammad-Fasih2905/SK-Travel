<svg width="220" height="220" viewBox="0 0 220 220" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="badge" x1="10" y1="210" x2="210" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F3D3E"/>
      <stop offset="100%" stop-color="#0A2B2C"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="220" x2="220" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D9A441"/>
      <stop offset="55%" stop-color="#E4572E"/>
      <stop offset="100%" stop-color="#0F3D3E"/>
    </linearGradient>
    <linearGradient id="gold" x1="40" y1="180" x2="180" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C88A2E"/>
      <stop offset="100%" stop-color="#F5E9D3"/>
    </linearGradient>
  </defs>

  <!-- outer ring -->
  <circle cx="110" cy="110" r="106" fill="none" stroke="url(#ring)" stroke-width="3"/>

  <!-- badge -->
  <circle cx="110" cy="110" r="94" fill="url(#badge)"/>

  <!-- globe meridians -->
  <g opacity="0.45" stroke="url(#gold)" stroke-width="1.1" fill="none">
    <ellipse cx="110" cy="110" rx="58" ry="94"/>
    <ellipse cx="110" cy="110" rx="94" ry="58"/>
    <line x1="16" y1="110" x2="204" y2="110"/>
  </g>

  <!-- flight path arcing across the globe, becoming a paper plane -->
  <path d="M42 138 C 78 96, 118 78, 150 60" stroke="url(#gold)" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-dasharray="1 9"/>

  <path d="M150 60 L128 118 L116 100 L98 108 Z" fill="url(#gold)"/>
  <path d="M150 60 L116 100" stroke="#0A2B2C" stroke-width="0.8" opacity="0.35" stroke-linecap="round"/>

  <!-- departure point -->
  <circle cx="42" cy="138" r="4.5" fill="url(#gold)"/>
</svg>
